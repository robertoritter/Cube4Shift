<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube4Shift</title>
<script>try{const t=localStorage.getItem("cube4shift.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" type="image/png" href="cube4code.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#1b1f27; --muted:#667085; --line:#e4e7ec;
  --accent:#2f5bea; --accent-soft:#e8eeff; --ok:#12805c; --ok-soft:#e3f6ee;
  --warn:#b54708; --warn-soft:#fef0e1; --bad:#c0322b; --bad-soft:#fdecea;
  --brand-ink:#0B2033; --violet:#8523D1;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){--bg:#12151b;--panel:#1a1e26;--ink:#e8ebf1;--muted:#98a2b3;--line:#2b313c;
  --accent:#6f8fff;--accent-soft:#232c48;--ok:#4cc79a;--ok-soft:#163328;--warn:#f5a25d;--warn-soft:#3a2a18;--bad:#f2766d;--bad-soft:#3b1d1b;
  --brand-ink:#F4F6FA;--violet:#A889FF;}
}
:root[data-theme=dark]{--bg:#12151b;--panel:#1a1e26;--ink:#e8ebf1;--muted:#98a2b3;--line:#2b313c;
  --accent:#6f8fff;--accent-soft:#232c48;--ok:#4cc79a;--ok-soft:#163328;--warn:#f5a25d;--warn-soft:#3a2a18;--bad:#f2766d;--bad-soft:#3b1d1b;
  --brand-ink:#F4F6FA;--violet:#A889FF;}
:root{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}

/* marca: símbolo à esquerda, nome em cima, assinatura embaixo */
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:38px;width:auto;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.wordmark{font-family:Manrope,Inter,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.04em;color:var(--brand-ink)}
.four{color:var(--violet);font-weight:800;font-size:1.1em;margin:0 1px}
.signature{font-family:Manrope,Inter,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:-.01em;color:var(--muted);text-decoration:none;margin-top:2px}
.signature .four{font-size:1em}
.signature:hover{text-decoration:underline}
@media (max-width:640px){.brand-text{display:none}}

nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
nav button.active{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.theme-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;font-size:16px}
.theme-btn:hover{border-color:var(--accent)}
#langSel{height:36px}
main{max-width:1400px;margin:0 auto;padding:24px}
.view{display:none}.view.active{display:block}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.card h3{margin:0 0 12px;font-size:15px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
input[type=time]{width:110px}input[type=number]{width:80px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.muted{color:var(--muted)}
.daychk{display:flex;gap:4px;flex-wrap:wrap}
.daychk label{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px}
.daychk input{margin:0}
.daychk label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sched-wrap{overflow-x:auto}
.sched th,.sched td{border:1px solid var(--line);text-align:center;white-space:nowrap;padding:6px 8px}
.sched th.name,.sched td.name{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;min-width:150px}
.sched td.shift{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.sched td.shift.partial{background:var(--warn-soft);color:var(--warn)}
.sched td.off{color:var(--muted);font-size:12px;cursor:pointer}
.sched td.blocked{background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--line) 5px,var(--line) 6px);color:var(--muted);font-size:11px}
.sched td.closed,.sched th.closed{background:var(--bg);color:var(--muted)}
.sched tr.cov td{font-size:12px;font-weight:600}
.sched th small{display:block;font-weight:500;text-transform:none;letter-spacing:0}
.weekblock{margin-bottom:22px}
.weekblock h4{margin:0 0 8px;font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;background:var(--c)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.45);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:40px 12px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border-radius:12px;max-width:760px;width:100%;padding:22px;border:1px solid var(--line)}
.modal h3{margin:0 0 14px}
.rest-item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.simple{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:0}
.simple td,.simple th{border:1px solid var(--ink);padding:3px 8px;text-align:center;vertical-align:top;white-space:nowrap}
.simple .wk th{font-size:15px;font-weight:700;background:var(--panel);text-transform:none;letter-spacing:0;color:var(--ink)}
.simple .hd th{background:var(--line);color:var(--ink);font-size:12px}
.simple td.per{font-weight:700;width:120px;text-align:center;vertical-align:middle}
.simple .nm{display:block;cursor:pointer;border-radius:4px;text-transform:uppercase}
.simple .nm:hover{background:var(--accent-soft)}
.simple .nm.partial{color:var(--warn)}
.simple tr.folga td{color:var(--bad);font-weight:700}
.simple tr.folga td.per{color:var(--ink)}
.simple td.closed{background:var(--bg);color:var(--muted)}
.simple-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:18px}
.board-week{margin-bottom:26px}
.board-week h4{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.bcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.bcol.closed{background:transparent;border-style:dashed;opacity:.55}
.bcol.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.bhead .dn{font-weight:700;font-size:13px}
.bhead .dd{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.02em}
.bhead .pill{margin:0}
.bper{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.bcard{--h:220;display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;cursor:pointer;
  background:hsl(var(--h) 85% 95%);border-left:3px solid hsl(var(--h) 60% 50%);transition:transform .08s}
.bcard:hover{transform:translateY(-1px)}
.bcard.partial{border-left-style:dashed}
.av{--h:220;width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:hsl(var(--h) 55% 50%)}
.bcard .bn{font-weight:600;font-size:12.5px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .bt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.bcard .bt b{color:var(--warn);font-family:Inter,sans-serif}
.boff{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.boff .avs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.boff .av{width:24px;height:24px;font-size:10px;cursor:pointer;opacity:.45;filter:saturate(.4)}
.boff .av:hover{opacity:1;filter:none}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .bcard{background:hsl(var(--h) 30% 20%)}}
:root[data-theme=dark] .bcard{background:hsl(var(--h) 30% 20%)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
textarea{width:100%;min-height:160px;font-family:'JetBrains Mono',monospace;font-size:12px}
.search{min-width:220px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="cube4code.png" alt="Cube4Code">
    <div class="brand-text">
      <span class="wordmark">Cube<span class="four">4</span>Shift</span>
      <a class="signature" href="https://cube4code.com/" target="_blank" rel="noopener">by Cube<span class="four">4</span>Code.com</a>
    </div>
  </div>
  <nav id="nav">
    <button data-view="escala" class="active" data-i18n="nav.schedule"></button>
    <button data-view="funcionarios" data-i18n="nav.employees"></button>
    <button data-view="empresa" data-i18n="nav.company"></button>
    <button data-view="dados" data-i18n="nav.data"></button>
  </nav>
  <div class="tools">
    <select id="langSel" data-i18n-title="lang.title">
      <option value="en">English</option>
      <option value="pt">Português (BR)</option>
    </select>
    <button class="theme-btn" id="themeBtn"></button>
  </div>
</header>

<main>
<!-- SCHEDULE -->
<section class="view active" id="v-escala">
  <h2 data-i18n="sch.title"></h2>
  <p class="sub" data-i18n="sch.sub"></p>
  <div class="card">
    <div class="row">
      <div class="field"><label data-i18n="sch.period"></label>
        <select id="mode"><option value="week" data-i18n="sch.weekly"></option><option value="month" data-i18n="sch.monthly"></option></select></div>
      <div class="field" id="f-week"><label data-i18n="sch.weekPick"></label><input type="date" id="weekDate"></div>
      <div class="field" id="f-month" style="display:none"><label data-i18n="sch.month"></label><input type="month" id="monthDate"></div>
      <div class="field"><label>&nbsp;</label><button class="btn primary" id="btnGen" data-i18n="sch.generate"></button></div>
      <div class="field"><label data-i18n="sch.view"></label>
        <select id="viewMode"><option value="detail" data-i18n="sch.viewDetail"></option><option value="simple" data-i18n="sch.viewSimple"></option><option value="board" data-i18n="sch.viewBoard"></option></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn" id="btnCsv" data-i18n="sch.copyCsv"></button></div>
    </div>
  </div>
  <div id="schedStats"></div>
  <div id="schedOut"></div>
</section>

<!-- EMPLOYEES -->
<section class="view" id="v-funcionarios">
  <div class="row" style="justify-content:space-between;margin-bottom:16px">
    <div><h2 data-i18n="emp.title"></h2><p class="sub" style="margin:0" data-i18n="emp.sub"></p></div>
    <div class="row"><input class="search" id="search" data-i18n-ph="emp.search"><button class="btn primary" id="btnNewEmp" data-i18n="emp.new"></button></div>
  </div>
  <div class="card" style="padding:0"><table id="empTable"></table></div>
</section>

<!-- COMPANY -->
<section class="view" id="v-empresa">
  <h2 data-i18n="co.title"></h2>
  <p class="sub" data-i18n="co.sub"></p>
  <div class="card">
    <h3 data-i18n="co.hours"></h3>
    <table id="compTable"></table>
  </div>
  <div class="card">
    <h3 data-i18n="co.rules"></h3>
    <div class="grid2">
      <div class="field"><label data-i18n="co.shiftHours"></label><input type="number" id="shiftHours" min="2" max="12" step="0.5"></div>
      <div class="field"><label data-i18n="co.minPartial"></label><input type="number" id="minPartial" min="1" max="12" step="0.5"></div>
      <div class="field"><label data-i18n="co.minRest"></label><input type="number" id="minRest" min="0" max="24" step="1"></div>
      <div class="field"><label data-i18n="co.defHours"></label><input type="number" id="defHours" min="1" max="70"></div>
      <div class="field"><label data-i18n="co.defDays"></label><input type="number" id="defDays" min="1" max="7"></div>
    </div>
    <p class="muted" style="margin:12px 0 0" data-i18n="co.partialNote"></p>
  </div>
</section>

<!-- DATA -->
<section class="view" id="v-dados">
  <h2 data-i18n="data.title"></h2>
  <p class="sub" data-i18n="data.sub"></p>
  <div class="card">
    <h3 data-i18n="data.backup"></h3>
    <div class="row" style="margin-bottom:10px">
      <button class="btn" id="btnExport" data-i18n="data.export"></button>
      <button class="btn" id="btnCopyJson" data-i18n="data.copy"></button>
      <button class="btn primary" id="btnImport" data-i18n="data.import"></button>
      <button class="btn danger" id="btnReset" data-i18n="data.reset"></button>
    </div>
    <textarea id="jsonBox" data-i18n-ph="data.ph"></textarea>
  </div>
</section>
</main>

<!-- EMPLOYEE MODAL -->
<div class="modal-bg" id="empModal">
  <div class="modal">
    <h3 id="empModalTitle"></h3>
    <div class="grid2">
      <div class="field"><label data-i18n="emp.name"></label><input id="eName"></div>
      <div class="field"><label data-i18n="emp.role"></label><input id="eRole"></div>
      <div class="field"><label data-i18n="emp.maxHours"></label><input type="number" id="eHours" min="1" max="70"></div>
      <div class="field"><label data-i18n="emp.maxDays"></label><input type="number" id="eDays" min="1" max="7"></div>
      <div class="field"><label data-i18n="emp.status"></label><select id="eActive"><option value="1" data-i18n="emp.active"></option><option value="0" data-i18n="emp.inactiveOpt"></option></select></div>
    </div>
    <h3 style="margin-top:20px" data-i18n="emp.restTitle"></h3>
    <p class="muted" style="margin-top:-8px" data-i18n="emp.restSub"></p>
    <div id="restList"></div>
    <div class="row" style="margin:6px 0 18px">
      <button class="btn sm" id="btnAddRec" data-i18n="emp.addRec"></button>
      <button class="btn sm" id="btnAddOne" data-i18n="emp.addOne"></button>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" id="btnCancel" data-i18n="btn.cancel"></button>
      <button class="btn primary" id="btnSave" data-i18n="btn.save"></button>
    </div>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-bg" id="confirmModal">
  <div class="modal" style="max-width:420px">
    <h3 id="confirmMsg"></h3>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cNo" data-i18n="btn.cancel"></button><button class="btn primary" id="cYes" data-i18n="btn.confirm"></button></div>
  </div>
</div>

<!-- CELL MODAL -->
<div class="modal-bg" id="cellModal">
  <div class="modal" style="max-width:440px">
    <h3 id="cellTitle"></h3>
    <div class="field" style="margin-bottom:10px"><label data-i18n="cell.person"></label><select id="cPerson"></select></div>
    <div class="row">
      <div class="field"><label data-i18n="cell.start"></label><input type="time" id="cStart"></div>
      <div class="field"><label data-i18n="cell.end"></label><input type="time" id="cEnd"></div>
    </div>
    <p class="muted" id="cellWarn"></p>
    <div class="row" style="justify-content:flex-end;margin-top:10px">
      <button class="btn danger" id="cClear" data-i18n="cell.remove"></button>
      <button class="btn" id="cCancel" data-i18n="btn.cancel"></button>
      <button class="btn primary" id="cSave" data-i18n="btn.save"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- i18n ---------- */
const I18N={

  'theme.toLight':'Switch to light theme','theme.toDark':'Switch to dark theme',
  'nav.schedule':'Schedule','nav.employees':'Employees','nav.company':'Company','nav.data':'Data',

const LANG_KEY='cube4shift.lang';
let lang='en';
try{const l=localStorage.getItem(LANG_KEY);if(l&&I18N[l])lang=l;}catch(e){}
function t(k,v){let s=(I18N[lang][k]??I18N.en[k]??k);if(typeof s==='string'&&v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s;}
const D=()=>t('days'),DF=()=>t('daysFull');

const KEY='cube4shift.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state;
function load(){try{const r=localStorage.getItem(KEY);state=r?JSON.parse(r):seed();}catch(e){state=seed();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove('show'),m.length>50?4500:2200);}

/* ---------- time helpers ---------- */
const toMin=x=>{if(!x)return null;const[h,m]=x.split(':').map(Number);return h*60+m;};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const dIso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const dow=d=>(d.getDay()+6)%7; // 0=Mon
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const monday=d=>addDays(d,-dow(d));
const p2=n=>String(n).padStart(2,'0');
const dm=d=>lang==='en'?p2(d.getMonth()+1)+'/'+p2(d.getDate()):p2(d.getDate())+'/'+p2(d.getMonth()+1);
const dmy=d=>dm(d)+'/'+String(d.getFullYear()).slice(2);

/* ---------- navigation ---------- */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+b.dataset.view));
});

/* ---------- COMPANY ---------- */
function renderCompany(){
  const c=state.company;
  let h=`<tr><th>${t('co.colDay')}</th><th>${t('co.colOpen')}</th><th>${t('co.colStart')}</th><th>${t('co.colEnd')}</th><th>${t('co.colStaff')}</th><th>${t('co.colSpan')}</th></tr>`;
  c.days.forEach((d,i)=>{
    let span=toMin(d.end)-toMin(d.start);if(span<=0)span+=1440;
    h+=`<tr><td><b>${DF()[i]}</b></td>
    <td><input type="checkbox" data-i="${i}" data-k="open" ${d.open?'checked':''}></td>
    <td><input type="time" data-i="${i}" data-k="start" value="${d.start}" ${d.open?'':'disabled'}></td>
    <td><input type="time" data-i="${i}" data-k="end" value="${d.end}" ${d.open?'':'disabled'}></td>
    <td><input type="number" min="1" max="50" data-i="${i}" data-k="minStaff" value="${d.minStaff}" ${d.open?'':'disabled'}></td>
    <td class="muted">${d.open?(span/60).toFixed(1).replace('.0','')+' h':t('co.closed')}</td></tr>`;
  });
  $('#compTable').innerHTML=h;
  $('#compTable').querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
    const d=c.days[inp.dataset.i],k=inp.dataset.k;
    d[k]=k==='open'?inp.checked:k==='minStaff'?Math.max(1,+inp.value||1):inp.value;
    save();renderCompany();
  });
  ['shiftHours','minPartial','minRest','defHours','defDays'].forEach(k=>{const el=$('#'+k);el.value=c[k];el.onchange=()=>{c[k]=+el.value;save();};});
}

/* ---------- EMPLOYEES ---------- */
function restLabel(r){
  const days=r.kind==='rec'?(r.days.length===7?t('rl.allDays'):r.days.map(i=>D()[i]).join(', ')):
    (r.from===r.to||!r.to?dm(parseIso(r.from)):t('rl.range',{a:dm(parseIso(r.from)),b:dm(parseIso(r.to))}));
  const what=r.type==='off'?t('rl.off'):r.type==='after'?t('rl.after',{t:r.time}):r.type==='before'?t('rl.before',{t:r.time}):t('rl.between',{a:r.time,b:r.time2});
  return `${days}: ${what}`;
}
function renderEmployees(){
  const q=($('#search').value||'').toLowerCase();
  const list=state.employees.filter(e=>(e.name+' '+(e.role||'')).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  if(!state.employees.length){$('#empTable').innerHTML=`<tr><td class="empty">${t('emp.none')}</td></tr>`;return;}
  let h=`<tr><th>${t('emp.colName')}</th><th>${t('emp.colRole')}</th><th>${t('emp.colLimits')}</th><th>${t('emp.colRest')}</th><th></th></tr>`;
  list.forEach(e=>{
    const rs=e.restrictions.map(r=>`<span class="pill ${r.kind==='one'?'warn':''}" title="${esc(r.note||'')}">${restLabel(r)}</span>`).join('')||`<span class="muted">${t('emp.noRest')}</span>`;
    h+=`<tr><td><b>${esc(e.name)}</b>${e.active?'':` <span class="pill bad">${t('emp.inactive')}</span>`}</td><td>${esc(e.role||'')}</td>
    <td class="muted">${t('emp.limits',{h:e.maxHours,d:e.maxDays})}</td><td>${rs}</td>
    <td style="white-space:nowrap"><button class="btn sm" data-edit="${e.id}">${t('btn.edit')}</button> <button class="btn sm danger" data-del="${e.id}">${t('btn.delete')}</button></td></tr>`;
  });
  $('#empTable').innerHTML=h;
  $('#empTable').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEmp(b.dataset.edit));
  $('#empTable').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const e=state.employees.find(x=>x.id===b.dataset.del);
    confirmBox(t('emp.confirmDelete',{n:e.name}),()=>{state.employees=state.employees.filter(x=>x.id!==e.id);save();renderEmployees();toast(t('emp.deleted'));});
  });
}
$('#search').oninput=renderEmployees;

let editing=null;
function openEmp(id){
  const c=state.company;
  editing=id?JSON.parse(JSON.stringify(state.employees.find(e=>e.id===id))):{id:uid(),name:'',role:'',maxHours:c.defHours,maxDays:c.defDays,active:true,restrictions:[]};
  editing._isNew=!id;
  $('#empModalTitle').textContent=id?t('emp.editTitle'):t('emp.newTitle');
  $('#eName').value=editing.name;$('#eRole').value=editing.role||'';$('#eHours').value=editing.maxHours;$('#eDays').value=editing.maxDays;$('#eActive').value=editing.active?'1':'0';
  renderRest();$('#empModal').classList.add('open');$('#eName').focus();
}
function renderRest(){
  const box=$('#restList');
  if(!editing.restrictions.length){box.innerHTML=`<p class="muted">${t('emp.noRestModal')}</p>`;return;}
  box.innerHTML=editing.restrictions.map(r=>{
    const when=r.kind==='rec'
      ?`<div class="daychk">${D().map((d,i)=>`<label><input type="checkbox" data-r="${r.id}" data-day="${i}" ${r.days.includes(i)?'checked':''}>${d}</label>`).join('')}</div>`
      :`<div class="row"><div class="field"><label>${t('rest.from')}</label><input type="date" data-r="${r.id}" data-k="from" value="${r.from||''}"></div><div class="field"><label>${t('rest.to')}</label><input type="date" data-r="${r.id}" data-k="to" value="${r.to||''}"></div></div>`;
    return `<div class="rest-item"><div class="row" style="justify-content:space-between"><span class="pill ${r.kind==='one'?'warn':''}">${r.kind==='rec'?t('rest.recurring'):t('rest.oneoff')}</span><button class="btn sm danger" data-rm="${r.id}">${t('rest.remove')}</button></div>
    ${when}
    <div class="row">
      <select data-r="${r.id}" data-k="type">
        <option value="off" ${r.type==='off'?'selected':''}>${t('rest.off')}</option>
        <option value="after" ${r.type==='after'?'selected':''}>${t('rest.after')}</option>
        <option value="before" ${r.type==='before'?'selected':''}>${t('rest.before')}</option>
        <option value="between" ${r.type==='between'?'selected':''}>${t('rest.between')}</option>
      </select>
      ${r.type==='off'?'':`<input type="time" data-r="${r.id}" data-k="time" value="${r.time||''}">`}
      ${r.type==='between'?`<span class="muted">${t('rest.and')}</span><input type="time" data-r="${r.id}" data-k="time2" value="${r.time2||''}">`:''}
      <input data-r="${r.id}" data-k="note" placeholder="${t('rest.note')}" value="${esc(r.note||'')}" style="flex:1;min-width:160px">
    </div></div>`;
  }).join('');

/* ---------- SCHEDULING ENGINE ---------- */
// blocked intervals (minutes of the day, may go past 1440) for a person on a date
function blocksFor(emp,date){
  const iso=dIso(date),wd=dow(date),out=[];
  emp.restrictions.forEach(r=>{
    const hit=r.kind==='rec'?r.days.includes(wd):(iso>=r.from&&iso<=(r.to||r.from));
    if(!hit)return;
    if(r.type==='off')out.push([-1e9,1e9,r]);
    else if(r.type==='after')out.push([toMin(r.time),1e9,r]);
    else if(r.type==='before')out.push([-1e9,toMin(r.time),r]);
    else if(r.type==='between'){let a=toMin(r.time),b=toMin(r.time2);if(b<=a)b+=1440;out.push([a,b,r]);}
  });
  return out;
}
const overlaps=(s,e,blocks)=>blocks.some(([a,b])=>s<b&&e>a);
// largest free sub-interval inside [s,e]
function freeWithin(s,e,blocks){
  let segs=[[s,e]];
  blocks.forEach(([a,b])=>{segs=segs.flatMap(([x,y])=>{if(b<=x||a>=y)return[[x,y]];const r=[];if(a>x)r.push([x,a]);if(b<y)r.push([b,y]);return r;});});
  segs.sort((p,q)=>(q[1]-q[0])-(p[1]-p[0]));
  return segs[0]||null;
}
function slotsFor(day){
  const c=state.company,s=toMin(day.start);let e=toMin(day.end);if(e<=s)e+=1440;
  const L=Math.round(c.shiftHours*60),W=e-s;
  if(W<=L)return[[s,e]];
  const n=Math.ceil(W/L),slots=[];
  for(let i=0;i<n;i++){const st=s+Math.round(i*(W-L)/(n-1)/15)*15;slots.push([st,Math.min(st+L,e)]);}
  slots[n-1]=[e-L,e];
  return slots;
}
function generate(start,end){
  const c=state.company,emps=state.employees.filter(e=>e.active);
  const assign={},gaps=[],stats={};
  emps.forEach(e=>{assign[e.id]={};stats[e.id]={total:0,days:0};});
  let week={},lastEnd={};
  for(let d=new Date(start);d<=end;d=addDays(d,1)){
    if(dow(d)===0||!Object.keys(week).length){week={};emps.forEach(e=>week[e.id]={h:0,d:0});}
    const iso=dIso(d),day=c.days[dow(d)];
    if(!day.open)continue;
    const dayAbs=Math.round((d-start)/864e5)*1440;
    const busy=new Set();
    slotsFor(day).forEach(([s,e])=>{
      for(let k=0;k<day.minStaff;k++){
        const can=(emp,ss,ee)=>{
          if(busy.has(emp.id))return false;
          const w=week[emp.id];
          if(w.d>=emp.maxDays||w.h+(ee-ss)/60>emp.maxHours+1e-9)return false;
          if(lastEnd[emp.id]!=null&&dayAbs+ss-lastEnd[emp.id]<c.minRest*60)return false;
          return true;
        };
        const rank=(a,b)=>(week[a.id].h-week[b.id].h)||(stats[a.id].total-stats[b.id].total)||a.name.localeCompare(b.name);
        const pool=emps.filter(emp=>can(emp,s,e)&&!overlaps(s,e,blocksFor(emp,d))).sort(rank);
        let pick=pool[0],ps=s,pe=e,partial=false;
        if(!pick){
          // partial shift inside the person's availability
          const opts=emps.map(emp=>{const f=freeWithin(s,e,blocksFor(emp,d));return f&&f[1]-f[0]>=c.minPartial*60&&can(emp,f[0],f[1])?{emp,f}:null;}).filter(Boolean)
            .sort((x,y)=>((y.f[1]-y.f[0])-(x.f[1]-x.f[0]))||rank(x.emp,y.emp));
          if(opts.length){pick=opts[0].emp;[ps,pe]=opts[0].f;partial=true;
            if(ps>s)gaps.push({iso,s,e:ps});if(pe<e)gaps.push({iso,s:pe,e});}
        }
        if(!pick){gaps.push({iso,s,e});continue;}
        busy.add(pick.id);
        assign[pick.id][iso]={s:ps,e:pe,partial};
        const h=(pe-ps)/60;week[pick.id].h+=h;week[pick.id].d++;stats[pick.id].total+=h;stats[pick.id].days++;
        lastEnd[pick.id]=dayAbs+pe;
      }
    });
  }
  return {start:dIso(start),end:dIso(end),assign,gaps,empIds:emps.map(e=>e.id)};
}

/* ---------- SCHEDULE RENDER ---------- */
let current=null;
function coverage(iso){
  const day=state.company.days[dow(parseIso(iso))];if(!day.open)return null;
  const s=toMin(day.start);let e=toMin(day.end);if(e<=s)e+=1440;
  let minc=Infinity;
  for(let x=s;x<e;x+=15){let n=0;current.empIds.forEach(id=>{const a=current.assign[id]?.[iso];if(a&&a.s<=x&&a.e>x)n++;});minc=Math.min(minc,n);}
  return {min:minc,need:day.minStaff};
}
function showEmpty(msgKey){$('#schedOut').innerHTML=`<div class="card empty">${t(msgKey)}</div>`;$('#schedStats').innerHTML='';}

  for(let d=new Date(start);d<=end;d=addDays(d,1)){if(dow(d)===0&&wk.length){weeks.push(wk);wk=[];}wk.push(new Date(d));}
  if(wk.length)weeks.push(wk);
  const outside=state.employees.filter(e=>!current.empIds.includes(e.id)).sort((a,b)=>a.name.localeCompare(b.name));
  let html=`<div class="card row" style="padding:12px 18px"><b>${t('sch.inSchedule')}</b> ${emps.length}
    ${outside.length?`<select id="addSel">${outside.map(e=>`<option value="${e.id}">${esc(e.name)}${e.active?'':` (${t('emp.inactive')})`}</option>`).join('')}</select><button class="btn sm" id="btnAddPerson">${t('sch.addToSchedule')}</button>`:`<span class="muted">${t('sch.allIn')}</span>`}

    days.forEach(d=>{const op=state.company.days[dow(d)].open;html+=`<th class="${op?'':'closed'}">${D()[dow(d)]}<small>${dm(d)}</small></th>`;});
    html+=`<th>${t('sch.hours')}</th></tr>`;
    emps.forEach(e=>{
      let h=0;html+=`<tr><td class="name"><button class="btn sm danger" style="float:right;padding:0 7px" title="${t('sch.removeFromSchedule')}" data-rmp="${e.id}">×</button><b>${esc(e.name)}</b><br><span class="muted" style="font-size:12px">${esc(e.role||'')}</span></td>`;

        else if(!op)html+=`<td class="closed">${t('sch.closed')}</td>`;
        else{const bl=blocksFor(e,d).some(b=>b[0]<-1e8&&b[1]>1e8);html+=bl?`<td class="blocked" data-e="${e.id}" data-d="${iso}" title="${t('sch.unavailTitle')}">${t('sch.unavail')}</td>`:`<td class="off" data-e="${e.id}" data-d="${iso}">${t('sch.off')}</td>`;}
      });
      html+=`<td><b>${h.toFixed(1).replace('.0','')}</b><span class="muted">/${e.maxHours}</span></td></tr>`;
    });
    html+=`<tr class="cov"><td class="name">${t('sch.coverage')}</td>`;
    days.forEach(d=>{const cv=coverage(dIso(d));html+=cv?`<td><span class="pill ${cv.min>=cv.need?'ok':'bad'}">${cv.min}/${cv.need}</span></td>`:'<td class="closed">-</td>';});
    html+='<td></td></tr></table></div></div>';
  });
  if(state.viewMode==='simple')html+=`<p class="muted">${t('sch.simpleNote')}</p>`;
  else if(state.viewMode==='board')html+=`<p class="muted">${t('board.note')}</p>`;
  else{const L=t('sch.legend');html+=`<div class="legend"><span style="--c:var(--accent-soft)">${L[0]}</span><span style="--c:var(--warn-soft)">${L[1]}</span><span style="--c:var(--line)">${L[2]}</span><span style="--c:var(--ok-soft)">${L[3]}</span><span style="--c:var(--bad-soft)">${L[4]}</span></div>

  if(current.gaps.length){

  $('#schedOut').querySelectorAll('[data-e][data-d]').forEach(td=>td.onclick=()=>openCell(td.dataset.e,td.dataset.d));
  const ab=$('#btnAddPerson');

/* simplified view, in the printed-sheet format */
const firstName=n=>n.trim().split(/\s+/)[0];
function periodOf(a,day){
  const s=toMin(day.start);let e=toMin(day.end);if(e<=s)e+=1440;
  if(a.s<=s+60)return 0; // starts at opening
  if(a.e>=e-60)return 2; // runs until closing
  const mid=(a.s+a.e)/2,third=(e-s)/3;
  return mid<s+third?0:mid<s+2*third?1:2;
}
function renderSimple(weeks,emps){
  const PER=t('simple.periods');
  let h='<div class="simple-wrap"><table class="simple">';
  weeks.forEach(days=>{
    const m=monday(days[0]),full=[0,1,2,3,4,5,6].map(i=>addDays(m,i));
    const inRange=d=>dIso(d)>=current.start&&dIso(d)<=current.end;
    const cols=full.map(d=>{
      const iso=dIso(d),day=state.company.days[dow(d)];
      if(!inRange(d)||!day.open)return{iso,closed:true,per:[[],[],[]],folga:[]};
      const per=[[],[],[]],folga=[];
      emps.forEach(e=>{const a=current.assign[e.id][iso];if(a)per[periodOf(a,day)].push({e,a});else folga.push(e);});
      per.forEach(l=>l.sort((x,y)=>x.a.s-y.a.s||x.e.name.localeCompare(y.e.name)));
      return{iso,per,folga};
    });
    h+=`<tr class="wk"><th colspan="8">${t('simple.range',{a:dmy(days[0]),b:dmy(days[days.length-1])})}</th></tr>
    <tr class="hd"><th>${t('simple.staff')}</th>${t('daysUpper').map(x=>`<th>${x}</th>`).join('')}</tr>`;
    PER.forEach((p,pi)=>{
      const n=Math.max(1,...cols.map(c=>c.per[pi].length));
      for(let r=0;r<n;r++){
        h+=`<tr>${r===0?`<td class="per" rowspan="${n}">${p}</td>`:''}`;
        cols.forEach(c=>{
          const it=c.per[pi][r];
          h+=c.closed?'<td class="closed"></td>':it?`<td><span class="nm ${it.a.partial?'partial':''}" data-e="${it.e.id}" data-d="${c.iso}" title="${esc(it.e.name)}: ${fmt(it.a.s)} - ${fmt(it.a.e)}">${esc(firstName(it.e.name))}</span></td>`:'<td></td>';
        });
        h+='</tr>';
      }
    });
    h+=`<tr class="folga"><td class="per">${t('simple.off')}</td>${cols.map(c=>c.closed?'<td class="closed"></td>':`<td>${c.folga.map(e=>`<span class="nm" data-e="${e.id}" data-d="${c.iso}" title="${esc(t('simple.clickToSchedule',{n:e.name}))}">${esc(firstName(e.name))}</span>`).join('')}</td>`).join('')}</tr>`;
  });
  return h+'</table></div>';
}

/* board view: modern card layout */
function hueOf(id){const i=state.employees.findIndex(e=>e.id===id);return (i*137.508+210)%360;}
const initials=n=>{const p=n.trim().split(/\s+/);return ((p[0]||'')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();};
function renderBoard(weeks,emps){
  const PER=t('simple.periods'),today=dIso(new Date());
  const cap=s=>s.charAt(0)+s.slice(1).toLowerCase();
  let h='';
  weeks.forEach(days=>{
    const m=monday(days[0]),full=[0,1,2,3,4,5,6].map(i=>addDays(m,i));
    h+=`<div class="board-week"><h4>${t('sch.weekOf',{a:dm(days[0]),b:dm(days[days.length-1])})}</h4><div class="board">`;
    full.forEach(d=>{
      const iso=dIso(d),day=state.company.days[dow(d)],inRange=iso>=current.start&&iso<=current.end;
      const head=`<div class="bhead"><div><div class="dn">${D()[dow(d)]}</div><div class="dd">${p2(d.getDate())}</div></div>`;
      if(!inRange||!day.open){h+=`<div class="bcol closed">${head}${inRange?`<span class="muted" style="font-size:12px">${t('sch.closed')}</span>`:''}</div></div>`;return;}
      const cv=coverage(iso);
      h+=`<div class="bcol ${iso===today?'today':''}">${head}<span class="pill ${cv.min>=cv.need?'ok':'bad'}" title="${t('sch.coverage')}">${cv.min}/${cv.need}</span></div>`;
      const per=[[],[],[]],off=[];
      emps.forEach(e=>{const a=current.assign[e.id][iso];if(a)per[periodOf(a,day)].push({e,a});else off.push(e);});
      per.forEach((l,pi)=>{
        if(!l.length)return;
        l.sort((x,y)=>x.a.s-y.a.s||x.e.name.localeCompare(y.e.name));
        h+=`<div class="bper">${cap(PER[pi])}</div>`;
        l.forEach(({e,a})=>{const hu=hueOf(e.id);
          h+=`<div class="bcard ${a.partial?'partial':''}" style="--h:${hu}" data-e="${e.id}" data-d="${iso}" title="${esc(e.name)}${e.role?' · '+esc(e.role):''}">
            <div class="av" style="--h:${hu}">${esc(initials(e.name))}</div>
            <div style="min-width:0"><div class="bn">${esc(firstName(e.name))}</div><div class="bt">${fmt(a.s)}-${fmt(a.e)}${a.partial?' <b>●</b>':''}</div></div></div>`;});
      });
      if(off.length)h+=`<div class="boff"><div class="bper">${t('board.off')} · ${off.length}</div><div class="avs">${off.map(e=>`<div class="av" style="--h:${hueOf(e.id)}" data-e="${e.id}" data-d="${iso}" title="${esc(t('simple.clickToSchedule',{n:e.name}))}">${esc(initials(e.name))}</div>`).join('')}</div></div>`;
      h+='</div>';
    });
    h+='</div></div>';
  });
  return h;
}

  }
  current.assign[to][iso]={s,e,partial:false};
  $('#cellModal').classList.remove('open');renderSchedule();
  if(overlaps(s,e,blocksFor(emp,d)))msg+=t('t.conflict',{n:emp.name});
  if(weekHours(to,iso)>emp.maxHours)msg+=t('t.overLimit');
  toast(msg);
};

/* ---------- schedule controls ---------- */
$('#viewMode').onchange=()=>{state.viewMode=$('#viewMode').value;save();renderSchedule();};
$('#mode').onchange=()=>{const m=$('#mode').value==='month';$('#f-week').style.display=m?'none':'';$('#f-month').style.display=m?'':'none';};
$('#weekDate').value=dIso(monday(addDays(new Date(),7)));
$('#monthDate').value=(()=>{const d=new Date();d.setMonth(d.getMonth()+1);return d.getFullYear()+'-'+p2(d.getMonth()+1);})();
$('#btnGen').onclick=()=>{
  if(!state.employees.some(e=>e.active)){toast(t('t.needEmp'));return;}
  let s,e;
  if($('#mode').value==='week'){if(!$('#weekDate').value)return;s=monday(parseIso($('#weekDate').value));e=addDays(s,6);}
  else{if(!$('#monthDate').value)return;const[y,m]=$('#monthDate').value.split('-').map(Number);s=new Date(y,m-1,1);e=new Date(y,m,0);}
  current=generate(s,e);renderSchedule();toast(t('t.generated'));
};
$('#btnCsv').onclick=async()=>{
  if(!current){toast(t('t.needGen'));return;}
  const dates=[];for(let d=parseIso(current.start);d<=parseIso(current.end);d=addDays(d,1))dates.push(dIso(d));
  let csv=t('csv.employee')+';'+t('csv.role')+';'+dates.map(i=>D()[dow(parseIso(i))]+' '+dm(parseIso(i))).join(';')+'\n';
  current.empIds.forEach(id=>{const e=state.employees.find(x=>x.id===id);if(!e)return;csv+=[e.name,e.role||'',...dates.map(i=>{const a=current.assign[id][i];return a?fmt(a.s)+'-'+fmt(a.e):'';})].join(';')+'\n';});
  try{await navigator.clipboard.writeText(csv);toast(t('t.csv'));}catch(err){$('#jsonBox').value=csv;document.querySelector('[data-view=dados]').click();toast(t('t.csvFail'));}
};

/* ---------- DATA ---------- */
$('#btnExport').onclick=()=>{$('#jsonBox').value=JSON.stringify(state,null,2);toast(t('data.generated'));};
$('#btnCopyJson').onclick=async()=>{if(!$('#jsonBox').value)$('#jsonBox').value=JSON.stringify(state,null,2);try{await navigator.clipboard.writeText($('#jsonBox').value);toast(t('data.copied'));}catch(e){$('#jsonBox').select();toast(t('data.selectCopy'));}};
$('#btnImport').onclick=()=>{
  try{const d=JSON.parse($('#jsonBox').value);if(!d.company||!Array.isArray(d.employees))throw 0;
    confirmBox(t('data.confirmImport'),()=>{state=d;save();current=null;renderAll();showEmpty('data.importedGen');toast(t('data.imported'));});
  }catch(e){toast(t('data.invalid'));}
};
$('#btnReset').onclick=()=>confirmBox(t('data.confirmReset'),()=>{state=seed();save();current=null;renderAll();toast(t('data.resetDone'));});

document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-bg.open').forEach(m=>m.classList.remove('open'));});

/* ---------- theme ---------- */
function isDark(){const x=document.documentElement.dataset.theme;return x?x==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}
function paintThemeBtn(){const d=isDark();$('#themeBtn').textContent=d?'☀':'☾';$('#themeBtn').title=d?t('theme.toLight'):t('theme.toDark');}
$('#themeBtn').onclick=()=>{const x=isDark()?'light':'dark';document.documentElement.dataset.theme=x;try{localStorage.setItem('cube4shift.theme',x);}catch(e){}paintThemeBtn();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintThemeBtn);}catch(e){}

/* ---------- language ---------- */
function applyI18n(){
  document.documentElement.lang=lang==='pt'?'pt-BR':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-title]').forEach(el=>el.title=t(el.dataset.i18nTitle));
  $('#langSel').value=lang;
  paintThemeBtn();
}
$('#langSel').onchange=()=>{lang=$('#langSel').value;try{localStorage.setItem(LANG_KEY,lang);}catch(e){}applyI18n();renderAll();
  if($('#empModal').classList.contains('open')){$('#empModalTitle').textContent=editing._isNew?t('emp.newTitle'):t('emp.editTitle');renderRest();}
  document.querySelectorAll('#cellModal.open,#confirmModal.open').forEach(m=>m.classList.remove('open'));};

function renderAll(){renderCompany();renderEmployees();renderSchedule();}
load();
if(state.schedule){current=state.schedule;current.empIds=current.empIds.filter(id=>state.employees.some(e=>e.id===id));}
$('#viewMode').value=state.viewMode||'detail';
applyI18n();renderAll();
</script>
</body>
</html>
