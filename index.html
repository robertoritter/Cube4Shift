<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --ink:#1b1f27; --muted:#667085; --line:#e4e7ec;
  --accent:#2f5bea; --accent-soft:#e8eeff; --ok:#12805c; --ok-soft:#e3f6ee;
  --warn:#b54708; --warn-soft:#fef0e1; --bad:#c0322b; --bad-soft:#fdecea;
  --brand-ink:#0B2033; --violet:#8523D1;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){--bg:#12151b;--panel:#1a1e26;--ink:#e8ebf1;--muted:#98a2b3;--line:#2b313c;
  --accent:#6f8fff;--accent-soft:#232c48;--ok:#4cc79a;--ok-soft:#163328;--warn:#f5a25d;--warn-soft:#3a2a18;--bad:#f2766d;--bad-soft:#3b1d1b;
  --brand-ink:#F4F6FA;--violet:#A889FF;}
}
:root[data-theme=dark]{--bg:#12151b;--panel:#1a1e26;--ink:#e8ebf1;--muted:#98a2b3;--line:#2b313c;
  --accent:#6f8fff;--accent-soft:#232c48;--ok:#4cc79a;--ok-soft:#163328;--warn:#f5a25d;--warn-soft:#3a2a18;--bad:#f2766d;--bad-soft:#3b1d1b;
  --brand-ink:#F4F6FA;--violet:#A889FF;}
:root{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]){color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
header{display:flex;align-items:center;gap:16px;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}

/* marca: símbolo à esquerda, nome em cima, assinatura embaixo */
.brand{display:flex;align-items:center;gap:11px}
.brand img{height:38px;width:auto;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.wordmark{font-family:Manrope,Inter,sans-serif;font-weight:700;font-size:19px;letter-spacing:-.04em;color:var(--brand-ink)}
.four{color:var(--violet);font-weight:800;font-size:1.1em;margin:0 1px}
.signature{font-family:Manrope,Inter,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:-.01em;color:var(--muted);text-decoration:none;margin-top:2px}
.signature .four{font-size:1em}
.signature:hover{text-decoration:underline}
@media (max-width:640px){.brand-text{display:none}}

nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
nav button.active{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.theme-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;font-size:16px}
.theme-btn:hover{border-color:var(--accent)}
#langSel{height:36px}
main{max-width:1400px;margin:0 auto;padding:24px}
.view{display:none}.view.active{display:block}
h2{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.card h3{margin:0 0 12px;font-size:15px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
input[type=time]{width:110px}input[type=number]{width:80px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);margin:2px 4px 2px 0}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.muted{color:var(--muted)}
.daychk{display:flex;gap:4px;flex-wrap:wrap}
.daychk label{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;cursor:pointer;font-size:13px}
.daychk input{margin:0}
.daychk label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.sched-wrap{overflow-x:auto}
.sched th,.sched td{border:1px solid var(--line);text-align:center;white-space:nowrap;padding:6px 8px}
.sched th.name,.sched td.name{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;min-width:150px}
.sched td.shift{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.sched td.shift.partial{background:var(--warn-soft);color:var(--warn)}
.sched td.off{color:var(--muted);font-size:12px;cursor:pointer}
.sched td.blocked{background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--line) 5px,var(--line) 6px);color:var(--muted);font-size:11px}
.sched td.closed,.sched th.closed{background:var(--bg);color:var(--muted)}
.sched tr.cov td{font-size:12px;font-weight:600}
.sched th small{display:block;font-weight:500;text-transform:none;letter-spacing:0}
.weekblock{margin-bottom:22px}
.weekblock h4{margin:0 0 8px;font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;background:var(--c)}
.modal-bg{position:fixed;inset:0;background:rgba(10,12,18,.45);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow-y:auto;padding:40px 12px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border-radius:12px;max-width:760px;width:100%;padding:22px;border:1px solid var(--line)}
.modal h3{margin:0 0 14px}
.rest-item{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.simple{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:0}
.simple td,.simple th{border:1px solid var(--ink);padding:3px 8px;text-align:center;vertical-align:top;white-space:nowrap}
.simple .wk th{font-size:15px;font-weight:700;background:var(--panel);text-transform:none;letter-spacing:0;color:var(--ink)}
.simple .hd th{background:var(--line);color:var(--ink);font-size:12px}
.simple td.per{font-weight:700;width:120px;text-align:center;vertical-align:middle}
.simple .nm{display:block;cursor:pointer;border-radius:4px;text-transform:uppercase}
.simple .nm:hover{background:var(--accent-soft)}
.simple .nm.partial{color:var(--warn)}
.simple tr.folga td{color:var(--bad);font-weight:700}
.simple tr.folga td.per{color:var(--ink)}
.simple td.closed{background:var(--bg);color:var(--muted)}
.simple-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:18px}
.board-week{margin-bottom:26px}
.board-week h4{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.bcol{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.bcol.closed{background:transparent;border-style:dashed;opacity:.55}
.bcol.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bhead{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.bhead .dn{font-weight:700;font-size:13px}
.bhead .dd{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.02em}
.bhead .pill{margin:0}
.bper{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.bcard{--h:220;display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:9px;cursor:pointer;
  background:hsl(var(--h) 85% 95%);border-left:3px solid hsl(var(--h) 60% 50%);transition:transform .08s}
.bcard:hover{transform:translateY(-1px)}
.bcard.partial{border-left-style:dashed}
.av{--h:220;width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:hsl(var(--h) 55% 50%)}
.bcard .bn{font-weight:600;font-size:12.5px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .bt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.bcard .bt b{color:var(--warn);font-family:Inter,sans-serif}
.boff{margin-top:auto;border-top:1px solid var(--line);padding-top:8px}
.boff .avs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.boff .av{width:24px;height:24px;font-size:10px;cursor:pointer;opacity:.45;filter:saturate(.4)}
.boff .av:hover{opacity:1;filter:none}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .bcard{background:hsl(var(--h) 30% 20%)}}
:root[data-theme=dark] .bcard{background:hsl(var(--h) 30% 20%)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
textarea{width:100%;min-height:160px;font-family:'JetBrains Mono',monospace;font-size:12px}
.search{min-width:220px}
#printFoot{display:none}
/* print layout: applied by the body.printing class (measured on screen, then printed) */
body.printing>header,body.printing .noprint,body.printing .view:not(#v-escala),
body.printing #v-escala>:not(#schedOut):not(#printFoot),body.printing .toast,body.printing .modal-bg{display:none!important}
body.printing{background:#fff;font-size:9px;line-height:1.15}
body.printing main{padding:0;margin:0;max-width:none}
body.printing #v-escala{display:block!important}
body.printing #schedOut{width:var(--pw);zoom:var(--pz,1)}
body.printing .card{border:none;padding:0;margin:0 0 4px;background:transparent}
body.printing .weekblock,body.printing .board-week,body.printing table.simple{break-inside:avoid;page-break-inside:avoid}
body.printing .sched-wrap,body.printing .simple-wrap{overflow:visible;border:none;padding:0;margin:0;background:transparent}
body.printing .sched th,body.printing .sched td{padding:1px 4px;line-height:1.15}
body.printing .sched th{font-size:8px}
body.printing .sched th.name,body.printing .sched td.name{min-width:0;position:static}
body.printing .sched td.name button,body.printing .sched td.shift br,body.printing .sched td.name br,body.printing .sched td.name .muted{display:none}
body.printing .sched td.shift{font-size:8.5px}
body.printing .sched td.shift .e::before{content:"-"}
body.printing .sched th small{display:inline;margin-left:3px}
body.printing .weekblock{margin-bottom:3px}body.printing .weekblock h4{margin:0 0 1px;font-size:9px}
body.printing .pill{padding:0 5px;font-size:8px;margin:0}
body.printing .legend{display:none}
body.printing table.simple{table-layout:fixed;width:100%;margin-bottom:3px!important;font-size:9px}
body.printing table.simple td.per{width:12%}
body.printing .simple td,body.printing .simple th{padding:0 4px;line-height:1.2;white-space:normal}
body.printing .simple .wk th{font-size:10px;padding:1px}
body.printing .simple .hd th{font-size:8px}
body.printing .nm:hover{background:none}
body.printing .simple tr.folga .nm{display:inline}
body.printing .simple tr.folga .nm:not(:last-child)::after{content:", "}
body.printing .board{grid-template-columns:repeat(7,1fr);overflow:visible;gap:3px}
body.printing .board-week{margin-bottom:4px}body.printing .board-week h4{margin:0 0 2px;font-size:8px}
body.printing .bcol{padding:3px;min-height:0;gap:2px;border-radius:6px}
body.printing .bhead .dd{font-size:12px}body.printing .bhead .dn{font-size:8px}
body.printing .bper{font-size:7px;margin-top:1px}
body.printing .bcard{padding:2px 4px;gap:4px;border-radius:5px}
body.printing .bcard .bn{font-size:8.5px}body.printing .bcard .bt{font-size:7.5px}
body.printing .av{width:14px;height:14px;font-size:6.5px}
body.printing .boff{padding-top:2px}body.printing .boff .avs{gap:2px;margin-top:1px}body.printing .boff .av{width:13px;height:13px}
#printFoot{align-items:center;gap:4px;font-family:Manrope,Inter,sans-serif;font-size:6.5px;color:#666}
#printFoot img{height:9px}
#printFoot .wordmark{font-size:7px;letter-spacing:-.02em}
#printFoot .four{font-size:1em;margin:0}
body.printing #printFoot{display:flex;justify-content:flex-end;margin-top:2px}
@media print{
  :root,:root[data-theme=dark]{--bg:#fff;--panel:#fff;--ink:#111;--muted:#555;--line:#c9ced6;--accent:#2f5bea;--accent-soft:#e8eeff;--ok:#12805c;--ok-soft:#e3f6ee;--warn:#b54708;--warn-soft:#fef0e1;--bad:#c0322b;--bad-soft:#fdecea;--brand-ink:#0B2033;--violet:#8523D1;color-scheme:light}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  body.printing #printFoot{position:fixed;bottom:0;right:0;margin:0}
}

<main>
<!-- SCHEDULE -->
<section class="view active" id="v-escala">
  <h2 data-i18n="sch.title"></h2>
  <p class="sub" data-i18n="sch.sub"></p>
  <div class="card">
    <div class="row">
      <div class="field"><label data-i18n="sch.period"></label>
        <select id="mode"><option value="week" data-i18n="sch.weekly"></option><option value="month" data-i18n="sch.monthly"></option></select></div>
      <div class="field" id="f-week"><label data-i18n="sch.weekPick"></label><input type="date" id="weekDate"></div>
      <div class="field" id="f-month" style="display:none"><label data-i18n="sch.month"></label><input type="month" id="monthDate"></div>
      <div class="field"><label>&nbsp;</label><button class="btn primary" id="btnGen" data-i18n="sch.generate"></button></div>
      <div class="field"><label data-i18n="sch.view"></label>
        <select id="viewMode"><option value="detail" data-i18n="sch.viewDetail"></option><option value="simple" data-i18n="sch.viewSimple"></option><option value="board" data-i18n="sch.viewBoard"></option></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn" id="btnCsv" data-i18n="sch.copyCsv"></button></div>
      <div class="field"><label data-i18n="pr.paper"></label>
        <select id="prPaper"><option value="A4">A4</option><option value="letter">Letter</option></select></div>
      <div class="field"><label data-i18n="pr.orient"></label>
        <select id="prOrient"><option value="landscape" data-i18n="pr.landscape"></option><option value="portrait" data-i18n="pr.portrait"></option></select></div>
      <div class="field"><label data-i18n="pr.scale"></label>
        <select id="prFit"><option value="1" data-i18n="pr.fit"></option><option value="0" data-i18n="pr.normal"></option></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn" id="btnPrint" data-i18n="pr.print"></button></div>
    </div>
  </div>
  <div id="schedStats"></div>
  <div id="schedOut"></div>
  <div id="printFoot"><span id="pfDate"></span><span>·</span><img alt="Cube4Code" id="printLogo"><span class="wordmark">Cube<span class="four">4</span>Shift</span><span>by Cube<span class="four">4</span>Code.com</span></div>
</section>

<!-- EMPLOYEES -->
<section class="view" id="v-funcionarios">
  <div class="row" style="justify-content:space-between;margin-bottom:16px">
    <div><h2 data-i18n="emp.title"></h2><p class="sub" style="margin:0" data-i18n="emp.sub"></p></div>
    <div class="row"><input class="search" id="search" data-i18n-ph="emp.search"><button class="btn primary" id="btnNewEmp" data-i18n="emp.new"></button></div>
  </div>
  <div class="card" style="padding:0"><table id="empTable"></table></div>
</section>

<!-- COMPANY -->
<section class="view" id="v-empresa">
  <h2 data-i18n="co.title"></h2>
  <p class="sub" data-i18n="co.sub"></p>
  <div class="card">
    <h3 data-i18n="co.hours"></h3>
    <table id="compTable"></table>
  </div>
  <div class="card">
    <h3 data-i18n="co.rules"></h3>
    <div class="grid2">
      <div class="field"><label data-i18n="co.shiftHours"></label><input type="number" id="shiftHours" min="2" max="12" step="0.5"></div>
      <div class="field"><label data-i18n="co.minPartial"></label><input type="number" id="minPartial" min="1" max="12" step="0.5"></div>
      <div class="field"><label data-i18n="co.minRest"></label><input type="number" id="minRest" min="0" max="24" step="1"></div>
      <div class="field"><label data-i18n="co.defHours"></label><input type="number" id="defHours" min="1" max="70"></div>
      <div class="field"><label data-i18n="co.defDays"></label><input type="number" id="defDays" min="1" max="7"></div>
    </div>
    <p class="muted" style="margin:12px 0 0" data-i18n="co.partialNote"></p>
  </div>
</section>

<!-- DATA -->
<section class="view" id="v-dados">
  <h2 data-i18n="data.title"></h2>
  <p class="sub" data-i18n="data.sub"></p>

  <div class="card">
    <h3 data-i18n="io.empTitle"></h3>
    <p class="muted" style="margin-top:-6px" data-i18n="io.empSub"></p>
    <div class="row" style="margin-bottom:6px">
      <b data-i18n="io.export"></b>
      <button class="btn" id="empDlCsv" data-i18n="io.dlCsv"></button>
      <button class="btn" id="empCpCsv" data-i18n="io.cpCsv"></button>
      <button class="btn" id="empDlJson" data-i18n="io.dlJson"></button>
      <button class="btn" id="empDlTpl" data-i18n="io.dlTpl"></button>
    </div>
    <div class="row" style="margin:14px 0 8px">

/* ---------- SCHEDULING ENGINE ---------- */
// blocked intervals (minutes of the day, may go past 1440) for a person on a date
function blocksFor(emp,date){
  const iso=dIso(date),wd=dow(date),out=[];
  emp.restrictions.forEach(r=>{
    const hit=r.kind==='rec'?r.days.includes(wd):(iso>=r.from&&iso<=(r.to||r.from));
    if(!hit)return;
    if(r.type==='off')out.push([-1e9,1e9,r]);
    else if(r.type==='after')out.push([toMin(r.time),1e9,r]);
    else if(r.type==='before')out.push([-1e9,toMin(r.time),r]);
    else if(r.type==='between'){let a=toMin(r.time),b=toMin(r.time2);if(b<=a)b+=1440;out.push([a,b,r]);}
  });
  return out;
}
const overlaps=(s,e,blocks)=>blocks.some(([a,b])=>s<b&&e>a);
// largest free sub-interval inside [s,e]
function freeWithin(s,e,blocks){
  let segs=[[s,e]];
  blocks.forEach(([a,b])=>{segs=segs.flatMap(([x,y])=>{if(b<=x||a>=y)return[[x,y]];const r=[];if(a>x)r.push([x,a]);if(b<y)r.push([b,y]);return r;});});
  segs.sort((p,q)=>(q[1]-q[0])-(p[1]-p[0]));
  return segs[0]||null;
}
function slotsFor(day){
  const c=state.company,s=toMin(day.start);let e=toMin(day.end);if(e<=s)e+=1440;
  const L=Math.round(c.shiftHours*60),W=e-s;
  if(W<=L)return[[s,e]];
  const n=Math.ceil(W/L),slots=[];
  for(let i=0;i<n;i++){const st=s+Math.round(i*(W-L)/(n-1)/15)*15;slots.push([st,Math.min(st+L,e)]);}
  slots[n-1]=[e-L,e];
  return slots;
}
function generate(start,end){
  const c=state.company,emps=state.employees.filter(e=>e.active);
  const assign={},gaps=[],stats={};
  emps.forEach(e=>{assign[e.id]={};stats[e.id]={total:0,days:0};});
  let week={},lastEnd={};
  for(let d=new Date(start);d<=end;d=addDays(d,1)){
    if(dow(d)===0||!Object.keys(week).length){week={};emps.forEach(e=>week[e.id]={h:0,d:0});}
    const iso=dIso(d),day=c.days[dow(d)];
    if(!day.open)continue;
    const dayAbs=Math.round((d-start)/864e5)*1440;
    const busy=new Set();
    slotsFor(day).forEach(([s,e])=>{
      for(let k=0;k<day.minStaff;k++){
        const can=(emp,ss,ee)=>{
          if(busy.has(emp.id))return false;
          const w=week[emp.id];
          if(w.d>=emp.maxDays||w.h+(ee-ss)/60>emp.maxHours+1e-9)return false;
          if(lastEnd[emp.id]!=null&&dayAbs+ss-lastEnd[emp.id]<c.minRest*60)return false;
          return true;
        };
        const rank=(a,b)=>(week[a.id].h-week[b.id].h)||(stats[a.id].total-stats[b.id].total)||a.name.localeCompare(b.name);
        const pool=emps.filter(emp=>can(emp,s,e)&&!overlaps(s,e,blocksFor(emp,d))).sort(rank);
        let pick=pool[0],ps=s,pe=e,partial=false;
        if(!pick){
          // partial shift inside the person's availability
          const opts=emps.map(emp=>{const f=freeWithin(s,e,blocksFor(emp,d));return f&&f[1]-f[0]>=c.minPartial*60&&can(emp,f[0],f[1])?{emp,f}:null;}).filter(Boolean)
            .sort((x,y)=>((y.f[1]-y.f[0])-(x.f[1]-x.f[0]))||rank(x.emp,y.emp));
          if(opts.length){pick=opts[0].emp;[ps,pe]=opts[0].f;partial=true;
            if(ps>s)gaps.push({iso,s,e:ps});if(pe<e)gaps.push({iso,s:pe,e});}
        }
        if(!pick){gaps.push({iso,s,e});continue;}
        busy.add(pick.id);
        assign[pick.id][iso]={s:ps,e:pe,partial};
        const h=(pe-ps)/60;week[pick.id].h+=h;week[pick.id].d++;stats[pick.id].total+=h;stats[pick.id].days++;
        lastEnd[pick.id]=dayAbs+pe;
      }
    });
  }
  return {start:dIso(start),end:dIso(end),assign,gaps,empIds:emps.map(e=>e.id)};
}

/* ---------- SCHEDULE RENDER ---------- */
let current=null;
function coverage(iso){
  const day=state.company.days[dow(parseIso(iso))];if(!day.open)return null;
  const s=toMin(day.start);let e=toMin(day.end);if(e<=s)e+=1440;
  let minc=Infinity;
  for(let x=s;x<e;x+=15){let n=0;current.empIds.forEach(id=>{const a=current.assign[id]?.[iso];if(a&&a.s<=x&&a.e>x)n++;});minc=Math.min(minc,n);}
  return {min:minc,need:day.minStaff};
}
function showEmpty(msgKey){$('#schedOut').innerHTML=`<div class="card empty">${t(msgKey)}</div>`;$('#schedStats').innerHTML='';}
function renderSchedule(){
  if(!current){showEmpty('sch.empty');return;}
  state.schedule=current;save();
  const start=parseIso(current.start),end=parseIso(current.end);
  const emps=current.empIds.map(id=>state.employees.find(e=>e.id===id)).filter(Boolean);
  const weeks=[];let wk=[];
  for(let d=new Date(start);d<=end;d=addDays(d,1)){if(dow(d)===0&&wk.length){weeks.push(wk);wk=[];}wk.push(new Date(d));}

/* simplified view, in the printed-sheet format */
const firstName=n=>n.trim().split(/\s+/)[0];
function periodOf(a,day){
  const s=toMin(day.start);let e=toMin(day.end);if(e<=s)e+=1440;
  if(a.s<=s+60)return 0; // starts at opening
  if(a.e>=e-60)return 2; // runs until closing
  const mid=(a.s+a.e)/2,third=(e-s)/3;
  return mid<s+third?0:mid<s+2*third?1:2;
}
function renderSimple(weeks,emps){
  const PER=t('simple.periods');
  let h='<div class="simple-wrap">';
  weeks.forEach(days=>{
    const m=monday(days[0]),full=[0,1,2,3,4,5,6].map(i=>addDays(m,i));
    const inRange=d=>dIso(d)>=current.start&&dIso(d)<=current.end;
    const cols=full.map(d=>{
      const iso=dIso(d),day=state.company.days[dow(d)];
      if(!inRange(d)||!day.open)return{iso,closed:true,per:[[],[],[]],folga:[]};
      const per=[[],[],[]],folga=[];
      emps.forEach(e=>{const a=current.assign[e.id][iso];if(a)per[periodOf(a,day)].push({e,a});else folga.push(e);});
      per.forEach(l=>l.sort((x,y)=>x.a.s-y.a.s||x.e.name.localeCompare(y.e.name)));
      return{iso,per,folga};
    });
    h+=`<table class="simple" style="margin-bottom:10px"><tr class="wk"><th colspan="8">${t('simple.range',{a:dmy(days[0]),b:dmy(days[days.length-1])})}</th></tr>
    <tr class="hd"><th>${t('simple.staff')}</th>${t('daysUpper').map(x=>`<th>${x}</th>`).join('')}</tr>`;
    PER.forEach((p,pi)=>{
      const n=Math.max(1,...cols.map(c=>c.per[pi].length));
      for(let r=0;r<n;r++){
        h+=`<tr>${r===0?`<td class="per" rowspan="${n}">${p}</td>`:''}`;
        cols.forEach(c=>{
          const it=c.per[pi][r];
          h+=c.closed?'<td class="closed"></td>':it?`<td><span class="nm ${it.a.partial?'partial':''}" data-e="${it.e.id}" data-d="${c.iso}" title="${esc(it.e.name)}: ${fmt(it.a.s)} - ${fmt(it.a.e)}">${esc(firstName(it.e.name))}</span></td>`:'<td></td>';
        });
        h+='</tr>';
      }
    });
    h+=`<tr class="folga"><td class="per">${t('simple.off')}</td>${cols.map(c=>c.closed?'<td class="closed"></td>':`<td>${c.folga.map(e=>`<span class="nm" data-e="${e.id}" data-d="${c.iso}" title="${esc(t('simple.clickToSchedule',{n:e.name}))}">${esc(firstName(e.name))}</span>`).join('')}</td>`).join('')}</tr></table>`;
  });
  return h+'</div>';
}

/* board view: modern card layout */
function hueOf(id){const i=state.employees.findIndex(e=>e.id===id);return (i*137.508+210)%360;}
const initials=n=>{const p=n.trim().split(/\s+/);return ((p[0]||'')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();};
function renderBoard(weeks,emps){
  const PER=t('simple.periods'),today=dIso(new Date());
  const cap=s=>s.charAt(0)+s.slice(1).toLowerCase();
  let h='';
  weeks.forEach(days=>{
    const m=monday(days[0]),full=[0,1,2,3,4,5,6].map(i=>addDays(m,i));
    h+=`<div class="board-week"><h4>${t('sch.weekOf',{a:dm(days[0]),b:dm(days[days.length-1])})}</h4><div class="board">`;
    full.forEach(d=>{
      const iso=dIso(d),day=state.company.days[dow(d)],inRange=iso>=current.start&&iso<=current.end;
      const head=`<div class="bhead"><div><div class="dn">${D()[dow(d)]}</div><div class="dd">${p2(d.getDate())}</div></div>`;
      if(!inRange||!day.open){h+=`<div class="bcol closed">${head}${inRange?`<span class="muted" style="font-size:12px">${t('sch.closed')}</span>`:''}</div></div>`;return;}
      const cv=coverage(iso);
      h+=`<div class="bcol ${iso===today?'today':''}">${head}<span class="pill ${cv.min>=cv.need?'ok':'bad'}" title="${t('sch.coverage')}">${cv.min}/${cv.need}</span></div>`;
      const per=[[],[],[]],off=[];
      emps.forEach(e=>{const a=current.assign[e.id][iso];if(a)per[periodOf(a,day)].push({e,a});else off.push(e);});
      per.forEach((l,pi)=>{
        if(!l.length)return;
        l.sort((x,y)=>x.a.s-y.a.s||x.e.name.localeCompare(y.e.name));
        h+=`<div class="bper">${cap(PER[pi])}</div>`;
        l.forEach(({e,a})=>{const hu=hueOf(e.id);
          h+=`<div class="bcard ${a.partial?'partial':''}" style="--h:${hu}" data-e="${e.id}" data-d="${iso}" title="${esc(e.name)}${e.role?' · '+esc(e.role):''}">
            <div class="av" style="--h:${hu}">${esc(initials(e.name))}</div>
            <div style="min-width:0"><div class="bn">${esc(firstName(e.name))}</div><div class="bt">${fmt(a.s)}-${fmt(a.e)}${a.partial?' <b>●</b>':''}</div></div></div>`;});
      });
      if(off.length)h+=`<div class="boff"><div class="bper">${t('board.off')} · ${off.length}</div><div class="avs">${off.map(e=>`<div class="av" style="--h:${hueOf(e.id)}" data-e="${e.id}" data-d="${iso}" title="${esc(t('simple.clickToSchedule',{n:e.name}))}">${esc(initials(e.name))}</div>`).join('')}</div></div>`;
      h+='</div>';
    });
    h+='</div></div>';
  });
  return h;
}

$('#cSave').onclick=()=>{
  let s=toMin($('#cStart').value),e=toMin($('#cEnd').value);if(s==null||e==null)return;if(e<=s)e+=1440;
  const {eid,iso}=cellCtx,to=$('#cPerson').value,d=parseIso(iso);
  const emp=state.employees.find(x=>x.id===to);
  let msg=t('t.adjusted');
  if(to!==eid){
    const other=current.assign[to][iso],mine=current.assign[eid][iso];
    delete current.assign[eid][iso];
    if(other&&mine){current.assign[eid][iso]=other;msg=t('t.swapped');}
    else msg=t('t.moved',{n:emp.name});
    const o=state.employees.find(x=>x.id===eid);
    if(current.assign[eid][iso]&&overlaps(other.s,other.e,blocksFor(o,d)))msg+=t('t.conflictOther',{n:o.name});
  }
  current.assign[to][iso]={s,e,partial:false};
  $('#cellModal').classList.remove('open');renderSchedule();

  toast(msg);
};

const stamp=()=>{const d=new Date();return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate());};
// inside the published artifact, files go through the platform "downloads" capability;

let dlCap=null;
try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(x=>{dlCap=x;}).catch(()=>{});}catch(e){}
async function downloadFile(name,content,mime){
  if(dlCap){

/* --- CSV helpers --- */
function csvCell(v){v=String(v??'');return /[";,\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function parseCsv(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const sep=(first.split(';').length>=first.split(',').length)?';':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const DAY_KEYS={mon:0,seg:0,tue:1,ter:1,wed:2,qua:2,thu:3,qui:3,fri:4,sex:4,sat:5,sab:5,sun:6,dom:6};
const KW={off:'off',folga:'off',indisponivel:'off',after:'after',depois:'after',before:'before',antes:'before',between:'between',entre:'between'};

/* restriction <-> text */
function restToText(r){
  const kw=t('io.kw');
  const days=r.kind==='rec'?(r.days.length===7?t('io.all'):r.days.map(i=>D()[i]).join(',')):(r.to&&r.to!==r.from?r.from+'..'+r.to:r.from);
  const rule=r.type==='off'?kw.off:r.type==='between'?kw.between+' '+r.time+'-'+r.time2:kw[r.type]+' '+r.time;
  const note=(r.note||'').replace(/[()|]/g,' ').trim();
  return days+' '+rule+(note?' ('+note+')':'');
}
function textToRest(seg){
  let x=seg.trim(),note='';
  const m=x.match(/\(([^)]*)\)\s*$/);if(m){note=m[1].trim();x=x.slice(0,m.index).trim();}
  const nx=norm(x);
  const km=nx.match(/\b(off|folga|indisponivel|after|depois|before|antes|between|entre)\b/);
  if(!km)return null;
  const type=KW[km[1]],daysPart=nx.slice(0,km.index).trim(),rest=nx.slice(km.index+km[1].length);
  const times=rest.match(/\d{1,2}:\d{2}/g)||[];
  const tt=h=>{const[a,b]=h.split(':');return p2(+a)+':'+b;};
  const r={id:uid(),type,time:'',note};
  if(type==='after'||type==='before'){if(!times[0])return null;r.time=tt(times[0]);}
  if(type==='between'){if(times.length<2)return null;r.time=tt(times[0]);r.time2=tt(times[1]);}
  const dates=daysPart.match(/\d{4}-\d{2}-\d{2}/g);
  if(dates){r.kind='one';r.from=dates[0];r.to=dates[1]||dates[0];if(r.to<r.from)r.to=r.from;return r;}
  let days;
  if(/^(all|todos|todo|every|everyday|diario)\b/.test(daysPart))days=[0,1,2,3,4,5,6];
  else{days=[...new Set(daysPart.split(/[,\s/]+/).filter(Boolean).map(d=>DAY_KEYS[d.slice(0,3)]))];if(!days.length||days.some(d=>d===undefined))return null;}
  r.kind='rec';r.days=days.sort();return r;
}

/* --- employees export --- */
function employeesCsv(list){
  const hdr=t('io.hdr');
  const lines=[hdr.join(';')];
  list.forEach(e=>lines.push([e.name,e.role||'',e.maxHours,e.maxDays,e.active?t('io.yes'):t('io.no'),e.restrictions.map(restToText).join(' | ')].map(csvCell).join(';')));
  return '﻿'+lines.join('\r\n')+'\r\n';

/* --- employees import --- */
const HDR_ALIASES={name:['name','nome'],role:['role','cargo','funcao'],maxHours:['max_hours_week','max_horas_semana','horas','hours'],maxDays:['max_days_week','max_dias_semana','dias','days'],active:['active','ativo','status'],restrictions:['restrictions','restricoes','restricao']};
function parseEmployeesText(txt){
  txt=txt.trim();if(!txt)return null;
  const c=state.company;
  if(txt[0]==='{'||txt[0]==='['){
    let d;try{d=JSON.parse(txt);}catch(e){return {error:t('data.invalid')};}
    const arr=Array.isArray(d)?d:Array.isArray(d.employees)?d.employees:null;
    if(!arr)return {error:t('io.errFormat')};
    return {rows:arr.map((e,i)=>{
      const errs=[];if(!String(e.name||'').trim())errs.push(t('io.errNoName'));
      const rs=(Array.isArray(e.restrictions)?e.restrictions:[]).filter(r=>r&&r.kind&&r.type).map(r=>({...r,id:uid()}));
      return {line:i+1,errs,emp:{name:String(e.name||'').trim(),role:String(e.role||''),maxHours:+e.maxHours||c.defHours,maxDays:Math.min(7,+e.maxDays||c.defDays),active:e.active!==false,restrictions:rs}};
    })};
  }
  const rows=parseCsv(txt);if(!rows.length)return null;
  const head=rows[0].map(norm);
  const idx={};for(const k in HDR_ALIASES){idx[k]=head.findIndex(h=>HDR_ALIASES[k].includes(h));}
  const hasHeader=idx.name>=0;
  const pos={name:0,role:1,maxHours:2,maxDays:3,active:4,restrictions:5};
  for(const k in pos)if(!hasHeader||idx[k]<0)idx[k]=hasHeader?-1:pos[k];
  const body=hasHeader?rows.slice(1):rows;
  return {rows:body.map((r,i)=>{
    const g=k=>idx[k]>=0?(r[idx[k]]??'').trim():'';
    const errs=[],rs=[];
    if(!g('name'))errs.push(t('io.errNoName'));
    g('restrictions').split('|').map(x=>x.trim()).filter(Boolean).forEach(seg=>{const rr=textToRest(seg);if(rr)rs.push(rr);else errs.push(t('io.errSeg',{x:seg}));});
    const act=norm(g('active'));
    return {line:i+(hasHeader?2:1),errs,emp:{name:g('name'),role:g('role'),maxHours:+g('maxHours').replace(',','.')||c.defHours,maxDays:Math.min(7,+g('maxDays')||c.defDays),active:!['no','nao','n','0','false','inativo','inactive'].includes(act),restrictions:rs}};
  })};
}
let pendingImport=null;
$('#empPreview').onclick=()=>{
  const res=parseEmployeesText($('#empBox').value);
  if(!res){toast(t('io.empty'));return;}
  if(res.error){toast(res.error);$('#empPrev').innerHTML='';return;}
  const mode=$('#empMode').value,byName=new Map(state.employees.map(e=>[norm(e.name),e]));
  let n=0,u=0,er=0;const seen=new Set();
  res.rows.forEach(r=>{
    // any error blocks the row, so an employee never loses data silently
    if(r.errs.length||!r.emp.name){r.status='error';er++;return;}
    const k=norm(r.emp.name);
    if(seen.has(k)){r.status='update';}else if(byName.has(k)){r.status='update';u++;}else{r.status='new';n++;}
    seen.add(k);
  });
  const errNames=new Set(res.rows.filter(r=>r.status==='error'&&r.emp.name).map(r=>norm(r.emp.name)));
  const removed=mode==='replace'?state.employees.filter(e=>!seen.has(norm(e.name))&&!errNames.has(norm(e.name))):[];
  const keep=mode==='replace'?state.employees.filter(e=>errNames.has(norm(e.name))&&!seen.has(norm(e.name))):[];
  pendingImport={rows:res.rows.filter(r=>r.status!=='error'),mode,keep};
  const pill={new:'ok',update:'',error:'bad'};
  let h=`<h3 style="margin:16px 0 8px">${t('io.prevTitle')}</h3><p><b>${t('io.summary',{n,u,e:er})}${removed.length?t('io.summaryRm',{r:removed.length}):''}</b>${er?` <span class="pill bad">${t('io.errNote')}</span>`:''}</p>
  <div style="max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px"><table><tr><th>${t('io.colRow')}</th><th>${t('emp.colName')}</th><th>${t('emp.colRole')}</th><th>${t('emp.colLimits')}</th><th>${t('emp.colRest')}</th><th>${t('io.colStatus')}</th></tr>`;
  res.rows.forEach(r=>{h+=`<tr><td class="muted">${r.line}</td><td><b>${esc(r.emp.name||'-')}</b>${r.emp.active?'':` <span class="pill bad">${t('emp.inactive')}</span>`}</td><td>${esc(r.emp.role)}</td><td class="muted">${t('emp.limits',{h:r.emp.maxHours,d:r.emp.maxDays})}</td>
    <td>${r.emp.restrictions.map(x=>`<span class="pill ${x.kind==='one'?'warn':''}">${restLabel(x)}</span>`).join('')}${r.errs.map(x=>`<span class="pill bad">${esc(x)}</span>`).join('')}</td>
    <td><span class="pill ${pill[r.status]}">${t('io.'+r.status)}</span></td></tr>`;});
  removed.forEach(e=>{h+=`<tr><td class="muted">-</td><td><s>${esc(e.name)}</s></td><td>${esc(e.role||'')}</td><td></td><td></td><td><span class="pill bad">${t('io.removed')}</span></td></tr>`;});
  h+=`</table></div><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn primary" id="empConfirm">${t('io.confirm')}</button></div>`;
  $('#empPrev').innerHTML=h;
  $('#empConfirm').onclick=applyEmployeeImport;
};
function applyEmployeeImport(){
  if(!pendingImport||!pendingImport.rows.length){toast(t('io.noValid'));return;}
  const {rows,mode,keep}=pendingImport;let n=0,u=0;
  const byName=new Map(state.employees.map(e=>[norm(e.name),e]));
  const next=mode==='replace'?[...keep]:[...state.employees];
  const placed=new Map(next.map(e=>[norm(e.name),e]));
  rows.forEach(({emp})=>{
    const k=norm(emp.name),prev=byName.get(k),target=placed.get(k);
    if(target){Object.assign(target,emp);if(prev)u++;}
    else{const e={id:prev?prev.id:uid(),...emp};next.push(e);placed.set(k,e);prev?u++:n++;}
  });
  state.employees=next;
  if(current){current.empIds=current.empIds.filter(id=>next.some(e=>e.id===id));}
  save();renderAll();pendingImport=null;$('#empPrev').innerHTML='';$('#empBox').value='';
  toast(t('io.done',{n,u}));
}

/* ---------- print ---------- */
const PAPER={A4:[210,297],letter:[215.9,279.4]},MARGIN_MM=7,FOOT_MM=4,MM=96/25.4,MIN_ZOOM=0.5,MAX_ZOOM=1.4;
function printPrefs(){const p=state.print||{};return {paper:p.paper||(lang==='en'?'letter':'A4'),orient:p.orient||'landscape',fit:p.fit!==false};}
function applyPrint(){
  const p=printPrefs();$('#prPaper').value=p.paper;$('#prOrient').value=p.orient;$('#prFit').value=p.fit?'1':'0';
  $('#pageStyle').textContent=`@page{size:${p.paper} ${p.orient};margin:${MARGIN_MM}mm}`;
  $('#printLogo').src=document.querySelector('.brand img').src;
  const now=new Date();
  $('#pfDate').textContent=(current?dmy(parseIso(current.start))+' - '+dmy(parseIso(current.end))+' · ':'')+t('pr.generated',{d:dmy(now)+' '+fmt(now.getHours()*60+now.getMinutes())});
}
['prPaper','prOrient','prFit'].forEach(id=>$('#'+id).onchange=()=>{state.print={paper:$('#prPaper').value,orient:$('#prOrient').value,fit:$('#prFit').value==='1'};save();applyPrint();});
// lay the page out at the printable width and shrink it until it fits one sheet
function preparePrint(){
  applyPrint();
  const p=printPrefs();let [w,h]=PAPER[p.paper];if(p.orient==='landscape')[w,h]=[h,w];
  const availW=(w-2*MARGIN_MM)*MM,availH=(h-2*MARGIN_MM-FOOT_MM)*MM;
  const out=$('#schedOut'),root=document.body;
  root.classList.add('printing');
  root.style.setProperty('--pw',Math.floor(availW)+'px');root.style.setProperty('--pz','1');
  let z=1;
  if(p.fit){
    const set=z=>{root.style.setProperty('--pw',Math.floor(availW/z)+'px');root.style.setProperty('--pz',String(z));return out.getBoundingClientRect().height;};
    let hh=set(z);
    for(let i=0;i<8;i++){
      const nz=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,z*availH/hh*0.99));
      if(Math.abs(nz-z)<0.005)break;
      z=nz;hh=set(z);
    }
    while(hh>availH&&z>MIN_ZOOM){z=Math.max(MIN_ZOOM,z*availH/hh*0.98);hh=set(z);}
  }
  return z;
}
function endPrint(){document.body.classList.remove('printing');}
function printableHtml(){
  preparePrint();
  const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');
  const st=document.body.style;
  const body=`<main><section id="v-escala" class="view active"><div id="schedOut">${$('#schedOut').innerHTML}</div>${$('#printFoot').outerHTML}</section></main>`;
  endPrint();
  return `<!DOCTYPE html><html lang="${document.documentElement.lang}" data-theme="light"><head><meta charset="UTF-8"><title>Cube4Shift</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>${css}</style></head>
<body class="printing" style="--pw:${st.getPropertyValue('--pw')};--pz:${st.getPropertyValue('--pz')}">${body}
<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),400));<\/script></body></html>`;
}
$('#btnPrint').onclick=()=>{
  if(!current){toast(t('t.needGen'));return;}
  if(dlCap){downloadFile(`cube4shift-print-${current.start}.html`,printableHtml(),'text/html').then(ok=>{if(ok)toast(t('pr.fileReady'));});return;}
  preparePrint();window.print();
};
